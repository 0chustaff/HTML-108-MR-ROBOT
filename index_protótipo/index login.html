<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Mr. Robot</title>
    <!-- Sobe uma pasta pra achar o style.css da raiz -->
    <link rel="stylesheet" href="../style.css">
    <link rel="shortcut icon" href="../fav-mr-robot.ico" type="image/x-icon">
    <style>
     body{background-image:url("ChatGPT Image 1 de out. de 2026, 14_03_36.png")}


    </style>
</head>

<body>

    <!-- TARJA IGUAL À DO INDEX -->
    <header class="tarja-site">
        <div class="marca">
            <a href="../index.html">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Mr._Robot_Logo.svg" 
                     alt="Mr. Robot" 
                     class="logo-img">
            </a>
        </div>

        <nav class="navegacao">
            <ul>
                <li><a href="../serie/personagens/personagens.html">Série</a></li>
                <li><a href="#">Temporadas</a></li>
                <li><a href="#">Sobre nós</a></li>
            </ul>
        </nav>
    </header>

    <!-- FORMULÁRIO DE LOGIN -->
    <div class="login-container">
        <div class="login-box">
            <h2>Login</h2>
            <form>
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário">

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha">

                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>

</body>
</html>
