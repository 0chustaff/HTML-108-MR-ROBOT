<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Robot</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel="stylesheet">
    <link rel="stylesheet" href="style.css">
      <style>
  body {
      background-color: #000;
      background-image:url("https://wallpapercave.com/wp/wp4507696.jpg");
    }
                                         
                         
        .login-box {
    border: 1px solid #1f1212;      
    padding: 40px 45px;  
    background: rgba(238, 234, 234, 0.445);
    border-radius: 6px;             
    box-shadow: 0 0 20px rgb(94, 165, 88)
    max-width: 400px;
    width: 100%;
}

.gif-lado {
  position: fixed;
  right: 20px;    
   top: 600px;       
    transform: translateY(-50%); 
  width: 300px;       
  height: 50vh;
}
  table {
    background: white;
    padding: 100px;
    border-radius: 10px;
    box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
    border-collapse: separate;
    border-spacing: 0 10px;
    width: 600px;
  }

  td {
    padding: 5px 0;
  }

  td label {
    color: #555;
    font-size: 14px;
  }

  input {
    width: 100%;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 6px;
    box-sizing: border-box;
  }

  input:focus {
    outline: none;
    border-color: #e74c3c;
    box-shadow: 0 0 5px rgba(231, 76, 60, 0.5);
  }

  .botao-celula {
    text-align: center;
  }

  .botao-celula button {
    width: 100%;
    padding: 12px;
    background: #e74c3c;
    color: white;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
    transition: all 0.3s ease;
  }

  .botao-celula button:hover {
    background: #c0392b;
    box-shadow: 0 0 15px #e74c3c,
                0 0 30px #e74c3c;
  }

  .titulo {
    text-align: center;
    font-size: 20px;
    color: #333;
    padding-bottom: 10px;
  }
</style>
</head>
<body>

  <table>
    <tr>
      <td colspan="2" class="titulo">Login</td>
    </tr>
    <tr>
      <td><label for="usuario">Usuário</label></td>
    </tr>
    <tr>
      <td><input type="text" id="usuario" placeholder="Digite seu usuário"></td>
    </tr>
    <tr>
      <td><label for="senha">Senha</label></td>
    </tr>
    <tr>
      <td><input type="password" id="senha" placeholder="Digite sua senha"></td>
    </tr>
    <tr>
      <td class="botao-celula">
        <button type="submit">Entrar</button>
      </td>
    </tr>
  </table>

</body>
</html>
