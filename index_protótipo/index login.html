<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mr. Robot</title>
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <style>
        .logo{max-width: 100%;
              filter: drop-shadow((0 0 6px #e74c3c);  
        height: 45px;}
        



        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #000;
            background-image: url("https://wallpapercave.com/wp/wp4507720.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        
        header {
            position: relative;
            z-index: 5;
            width: 100%;
            padding: 25px 40px;
            background: rgba(0, 0, 0, 0.7);
            border-bottom: 2px solid #e74c3c;
            box-shadow: 0 0 20px rgba(231, 76, 60, 0.5);
        }

        header .logo {
            font-size: 32px;
            font-weight: bold;
            letter-spacing: 6px;
            text-transform: uppercase;
            color: #e74c3c;
            text-shadow: 0 0 10px #e74c3c,
                         0 0 20px #e74c3c;
        }

       
        .login-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 90px); 
            padding: 30px;
        }

        .login-box {
            width: 100%;
            max-width: 400px;
            padding: 40px 35px;
            background: rgba(15, 15, 15, 0.88);
            border: 1px solid #e74c3c;
            border-radius: 10px;
            box-shadow: 0 0 25px rgba(231, 76, 60, 0.7),
                        0 0 60px rgba(231, 76, 60, 0.3);
            backdrop-filter: blur(6px);
        }

        .login-box h2 {
            text-align: center;
            color: #e74c3c;
            font-size: 26px;
            margin-bottom: 25px;
            letter-spacing: 4px;
            text-transform: uppercase;
            text-shadow: 0 0 10px #e74c3c;
        }

        .login-box label {
            display: block;
            color: #ccc;
            font-size: 13px;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .login-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid #444;
            border-radius: 6px;
            color: #fff;
            font-size: 14px;
            transition: all 0.3s ease;
        }

        .login-box input::placeholder {
            color: #888;
        }

        .login-box input:focus {
            outline: none;
            border-color: #e74c3c;
            box-shadow: 0 0 10px rgba(231, 76, 60, 0.7);
            background: rgba(255, 255, 255, 0.12);
        }

        .login-box button {
            width: 100%;
            padding: 13px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .login-box button:hover {
            background: #c0392b;
            box-shadow: 0 0 15px #e74c3c,
                        0 0 30px #e74c3c,
                        0 0 45px #e74c3c;
            transform: translateY(-2px);
        }
    </style>
    <div class="marca">
        <a href="index_protótipo/index copy.html">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Mr._Robot_Logo.svg" alt="Mr. Robot" class="logo">
        </a>
    </div>

    <nav class="navegacao">
        <ul>
            <li><a href="#">Sobre</a></li>
            <li><a href="serie/personagens/personagens.html">Personagens</a></li>
            <li><a href="index_protótipo/index copy.html">Original</a></li>
            </ul>
        </nav>
</head>
<body>

   
    <div class="login-container">
        <div class="login-box">
            <h2>Login</h2>
            <form>
                <label for="usuario">Usuário</label>
                <input type="text" id="usuario" placeholder="Digite seu usuário">

                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Digite sua senha">

                <button type="submit">Entrar</button>
            </form>
        </div>
    </div>

</body>
</html>
