<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personagens - Mr. Robot</title>
    <link rel="stylesheet" href="personagens.css">
    <link rel="shortcut icon" href="../fav-mr-robot.ico" type="image/x-icon">
    <style>
        body {
            background-image: url("https://imgs.search.brave.com/g11uFO6ZTm68iWlP2kHaWOpbJcnFPfAgU70LLGEqkQo/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tLm1l/ZGlhLWFtYXpvbi5j/b20vaW1hZ2VzL00v/TVY1Qk9UZzROVEJp/WkRBdFpUYzBZUzAw/TnpabExUZzRZMkl0/TkdRM00yWmxNRE01/TVdRelhrRXlYa0Zx/Y0djQC5qcGc");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            min-height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            color: #fff;
        }

        /* Tarja do site */
        .tarja-site {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: rgba(0, 0, 0, 0.8);
            border-bottom: 2px solid #e74c3c;
        }

        .logo-img {
            height: 45px;
        }

        .navegacao ul {
            display: flex;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
        }

        .navegacao a {
            color: #fff;
            text-decoration: none;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .navegacao a:hover {
            color: #e74c3c;
        }

        /* Título */
        h1 {
            text-align: center;
            color: #e74c3c;
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin: 40px 0 20px 0;
            text-shadow: 0 0 10px #e74c3c;
        }

        /* Tabela */
        .tabela {
            margin: 0 auto 60px auto;
            border-collapse: collapse;
            background: rgba(0, 0, 0, 0.75);
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 25px rgba(231, 76, 60, 0.4);
            max-width: 900px;
            width: 90%;
        }

        .tabela th {
            background: #e74c3c;
            color: #000;
            padding: 12px;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-size: 14px;
        }

        .tabela td {
            padding: 12px;
            border-bottom: 1px solid #333;
            color: #fff;
            font-size: 14px;
        }

        .tabela tr:hover {
            background: rgba(231, 76, 60, 0.15);
        }

        .tabela img {
            height: 120px;
            width: auto;
            border-radius: 6px;
            display: block;
        }

        .ator a {
            color: #ff2a2a;
            text-decoration: none;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .ator a:hover {
            color: #fff;
            text-shadow: 0 0 10px #ff2a2a;
        }
    </style>
</head>

<body>

    <!-- CABEÇALHO (logo + navegação JUNTOS) -->
    <header class="tarja-site">
        <div class="marca">
            <a href="../index.html">
                <img src="https://upload.wikimedia.org/wikipedia/commons/4/4b/Mr._Robot_Logo.svg" 
                     alt="Mr. Robot" 
                     class="logo-img">
            </a>
        </div>

        <nav class="navegacao">
            <ul>
                <li><a href="../index.html">Início</a></li>
                <li><a href="#">Temporadas</a></li>
                <li><a href="#">Sobre nós</a></li>
            </ul>
        </nav>
    </header>

    <!-- TÍTULO -->
    <h1>Principais Personagens</h1>

    <!-- TABELA -->
    <table class="tabela">
        <tr>
            <th>Foto</th>
            <th>Ator</th>
            <th>Personagem</th>
        </tr>

        <tr>
            <td>
                <img src="https://br.web.img3.acsta.net/c_162_216/pictures/19/02/27/20/54/3444169.jpg" alt="Elliot">
            </td>
            <td class="ator">
                <a target="_blank" href="https://www.adorocinema.com/personalidades/personalidade-135438/">Rami Malek</a>
            </td>
            <td>Elliot Alderson</td>
        </tr>

        <tr>
            <td>
                <img src="https://br.web.img3.acsta.net/c_162_216/img/44/a9/44a9a700788f7e535a832371c601bf15.jpg" alt="Mr. Robot">
            </td>
            <td class="ator">
                <a target="_blank" href="https://www.adorocinema.com/personalidades/personalidade-13604/">Christian Slater</a>
            </td>
            <td>Mr. Robot</td>
        </tr>

        <!-- ... resto das linhas ... -->

    </table>

</body>
</html>
